services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "app.py"]
    environment:
      PORT: "5000"
      SELENIUM_URL: http://selenium:4444
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  selenium:
    image: selenium/standalone-chrome:4.34.0-20250727
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:4444/status | grep -q '\"ready\":[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
