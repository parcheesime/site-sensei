<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Self Check | Site Sensei</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Student Self Check</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p role="alert">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('student_upload') }}">
      <label for="url">Project URL</label>
      <input
        id="url"
        name="url"
        type="url"
        placeholder="https://example.com/my-project"
        value="{{ submitted_url or '' }}"
        required
      >
      <button type="submit">Check my webpage</button>
    </form>

    <p><a href="{{ url_for('teacher_login') }}">Teacher batch grading</a></p>
    <p><a href="{{ url_for('home') }}">Return home</a></p>
  </main>
</body>
</html>
