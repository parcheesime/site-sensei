<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Feedback | Site Sensei</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="student-report">
        <header class="student-report__header">
            <p class="student-report__eyebrow">Student Self Check</p>
            <h1>Student Feedback</h1>
            {% if submitted_url not in feedback_html %}
                <p class="student-report__url">
                    Project:
                    <a href="{{ submitted_url }}" target="_blank" rel="noopener noreferrer">
                        {{ submitted_url }}
                    </a>
                </p>
            {% endif %}
        </header>

        <section class="student-report__panel" aria-labelledby="feedback-heading">
            <h2 id="feedback-heading">Webpage review</h2>
            <div class="student-report__content">
                {{ feedback_html | safe }}
            </div>
        </section>

        <nav class="student-report__actions" aria-label="Student feedback actions">
            <a class="student-report__button" href="{{ url_for('student_upload') }}">
                Check another webpage
            </a>
            <a class="student-report__secondary-link" href="{{ url_for('home') }}">
                Return home
            </a>
        </nav>
    </main>
</body>
</html>
